services:
  - type: web
    name: access-to-login
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
        
